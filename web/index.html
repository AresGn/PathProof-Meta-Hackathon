<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathProof — démo</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #1a1a1a;
        background: #f6f7f9;
      }
      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 0.25rem;
      }
      .muted {
        color: #555;
        font-size: 0.95rem;
      }
      fieldset {
        border: 1px solid #ccc;
        border-radius: 8px;
        margin: 1rem 0;
        padding: 1rem;
        background: #fff;
      }
      legend {
        font-weight: 600;
        padding: 0 0.25rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        background: #1877f2;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #steps,
      #report {
        margin-top: 1rem;
        padding: 1rem;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #ddd;
        min-height: 3rem;
      }
      #steps ol {
        margin: 0;
        padding-left: 1.25rem;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }
      .error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>PathProof</h1>
    <p class="muted">
      Démo : envoyez une photo de relevé et un message vocal. L’agent affichera
      ses étapes d’outils puis un rapport avec sources.
    </p>

    <form id="demo-form">
      <fieldset>
        <legend>Entrées élève</legend>
        <label>
          Photo du relevé (JPEG/PNG)
          <input type="file" id="photo" accept="image/*" />
        </label>
        <label>
          Message vocal
          <input type="file" id="voice" accept="audio/*" />
        </label>
        <label>
          Texte de secours (si pas de note vocale)
          <textarea id="fallback-text" rows="3" placeholder="Série, intérêts, métier visé…"></textarea>
        </label>
        <button type="submit" id="submit-btn">Lancer l’orientation</button>
      </fieldset>
    </form>

    <p id="status" class="muted" aria-live="polite"></p>

    <h2>Étapes de l’agent</h2>
    <div id="steps"><p class="muted">Aucune exécution pour l’instant.</p></div>

    <div id="answer-block" hidden>
      <h2>Question de l’agent</h2>
      <p id="question"></p>
      <label>
        Votre réponse
        <input type="text" id="answer-input" />
      </label>
      <button type="button" id="answer-btn">Répondre</button>
    </div>

    <h2>Rapport</h2>
    <div id="report"><p class="muted">Le rapport apparaîtra ici.</p></div>

    <script src="app.js"></script>
  </body>
</html>
